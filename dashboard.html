<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Burn</title>
<style>
  :root {
    --navy:#1B2A4A; --gold:#F0A500; --ink:#2b3340; --muted:#8a93a6;
    --line:#e6e8ee; --bg:#ffffff; --cell0:#eef1f5;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  header { padding:28px 32px 8px; }
  h1 { margin:0; font-size:22px; color:var(--navy); letter-spacing:-.01em; }
  .sub { color:var(--muted); margin-top:4px; }
  .toprow { display:flex; align-items:flex-end; gap:32px; flex-wrap:wrap; }
  .total .v { font-size:30px; font-weight:800; color:var(--navy); }
  .total .l { color:var(--muted); font-size:12px; }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .toggle button { border:0; background:#fff; padding:7px 13px; font:inherit; color:var(--ink);
    cursor:pointer; border-right:1px solid var(--line); }
  .toggle button:last-child { border-right:0; }
  .toggle button.on { background:var(--navy); color:#fff; }
  section { padding:18px 32px; border-top:1px solid var(--line); }
  section h2 { margin:0 0 2px; font-size:15px; color:var(--navy); }
  section .hint { color:var(--muted); font-size:12px; margin-bottom:12px; }
  svg { max-width:100%; height:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .did { color:var(--ink); } .did .proj { color:var(--navy); font-weight:600; }
  .did .ses { color:var(--muted); }
  footer { padding:18px 32px 40px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Token Burn</h1>
  <div class="sub" id="subtitle"></div>
  <div class="toprow" style="margin-top:16px">
    <div class="total"><div class="v" id="totalVal">—</div><div class="l" id="totalLbl"></div></div>
    <div>
      <div class="l" style="color:var(--muted);font-size:12px;margin-bottom:5px">metric</div>
      <div class="toggle" id="toggle">
        <button data-m="total" class="on">Total compute</button>
        <button data-m="generative">Generative</button>
        <button data-m="output">Output only</button>
        <button data-m="cost">Cost $</button>
      </div>
    </div>
  </div>
</header>

<section><h2>Daily burn</h2><div class="hint" id="heatHint"></div><div id="heatmap"></div></section>
<section><h2>Over time (log scale)</h2><div class="hint">tokens/day — log axis spans the small early days and the big recent ones.</div><div id="timeseries"></div></section>
<section><h2>Top 10 days</h2><div class="hint">your biggest days — and what you were doing.</div><div id="topdays"></div></section>
<section><h2>By model &amp; by agent</h2><div class="hint">model mix, and main-thread vs sub-agent (parallel) work.</div><div id="models"></div></section>
<footer id="foot"></footer>

<script>
let DATA = "__DATA_PLACEHOLDER__";
let METRIC = 'total';
const METRIC_LBL = {total:'total compute touched', generative:'generative tokens', output:'output tokens', cost:'API-equivalent $'};

function metricValue(c, metric) {
  if (metric === 'total')      return c.in + c.out + c.cc + c.cr;
  if (metric === 'generative') return c.in + c.out + c.cc;
  if (metric === 'output')     return c.out;
  if (metric === 'cost')       return c.cost_usd;
  return 0;
}
function dayComponents(day) {
  const acc = {in:0,out:0,cc:0,cr:0,cost_usd:0};
  for (const m of Object.values(day.byModel)) for (const k in acc) acc[k] += m[k];
  return acc;
}
function fmtTok(n){ n=Math.round(n);
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(0)+'K'; return ''+n; }
function fmtVal(v){ return METRIC==='cost' ? '$'+(v>=1000?(v/1000).toFixed(1)+'K':v.toFixed(0)) : fmtTok(v); }
function dayVal(d){ return metricValue(dayComponents(d), METRIC); }
const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- heatmap ----------
function drawHeatmap(){
  const days = DATA.days; if(!days.length){document.getElementById('heatmap').innerHTML='';return;}
  const byDate = {}; days.forEach(d=>byDate[d.date]=d);
  const dt = s => new Date(s+'T00:00:00');
  const start = dt(days[0].date), end = dt(days[days.length-1].date);
  const gStart = new Date(start); gStart.setDate(gStart.getDate()-gStart.getDay()); // back to Sunday
  const vals = days.map(dayVal).filter(v=>v>0).sort((a,b)=>a-b);
  const q = p => vals.length? vals[Math.min(vals.length-1, Math.floor(p*vals.length))] : 0;
  const stops = [q(.2),q(.4),q(.6),q(.8)];
  const shades = ['#dbe7d3','#a7c98f','#5e9b54','#2f6b34','#13441f']; // light->deep green (Tufte-ish)
  const colorFor = v => { if(v<=0) return 'var(--cell0)';
    let i=0; while(i<stops.length && v>stops[i]) i++; return shades[i]; };
  const CELL=12, GAP=3, PAD_L=30, PAD_T=18;
  const totalDays = Math.round((end-gStart)/864e5);
  const cols = Math.floor(totalDays/7)+1;
  const W = PAD_L + cols*(CELL+GAP) + 4, H = PAD_T + 7*(CELL+GAP) + 4;
  let cells='', months='', prevMonth=-1;
  for(let i=0;i<=totalDays;i++){
    const d=new Date(gStart); d.setDate(d.getDate()+i);
    if(d<start) continue;
    const iso=d.toISOString().slice(0,10);
    const col=Math.floor(i/7), row=d.getDay();
    const x=PAD_L+col*(CELL+GAP), y=PAD_T+row*(CELL+GAP);
    const dd=byDate[iso]; const v=dd?dayVal(dd):0;
    const tip=iso+(dd?(': '+fmtVal(v)):': —');
    cells+=`<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="2" fill="${colorFor(v)}"><title>${tip}</title></rect>`;
    if(d.getMonth()!==prevMonth && row<=1){ prevMonth=d.getMonth();
      months+=`<text x="${x}" y="${PAD_T-6}" font-size="10" fill="var(--muted)">${d.toLocaleString('en',{month:'short'})}</text>`; }
  }
  const wd=['','Mon','','Wed','','Fri',''];
  let labels=''; wd.forEach((w,r)=>{ if(w) labels+=`<text x="0" y="${PAD_T+r*(CELL+GAP)+CELL-2}" font-size="9" fill="var(--muted)">${w}</text>`; });
  // legend
  let leg=`<text x="${PAD_L}" y="${H+12}" font-size="10" fill="var(--muted)">less</text>`;
  shades.forEach((s,i)=> leg+=`<rect x="${PAD_L+30+i*(CELL+2)}" y="${H+3}" width="${CELL}" height="${CELL}" rx="2" fill="${s}"/>`);
  leg+=`<text x="${PAD_L+30+shades.length*(CELL+2)+4}" y="${H+12}" font-size="10" fill="var(--muted)">more</text>`;
  document.getElementById('heatmap').innerHTML=`<svg viewBox="0 0 ${W} ${H+20}" width="${W}">${months}${labels}${cells}${leg}</svg>`;
}

// ---------- time series (log) ----------
function drawTimeseries(){
  const days=DATA.days; const host=document.getElementById('timeseries');
  if(days.length<2){host.innerHTML='';return;}
  const pts=days.map(d=>({date:new Date(d.date+'T00:00:00'), v:Math.max(1,dayVal(d))}));
  const W=920,H=300,L=54,R=16,T=14,B=28;
  const t0=pts[0].date.getTime(), t1=pts[pts.length-1].date.getTime();
  const vmax=Math.max(...pts.map(p=>p.v)), vmin=Math.min(...pts.map(p=>p.v));
  const lo=Math.floor(Math.log10(vmin)), hi=Math.ceil(Math.log10(vmax));
  const X=t=> L + (t1===t0?0:(t-t0)/(t1-t0))*(W-L-R);
  const Y=v=> T + (1-(Math.log10(v)-lo)/(hi-lo||1))*(H-T-B);
  let grid='',ax='';
  for(let p=lo;p<=hi;p++){ const y=Y(Math.pow(10,p));
    grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--line)"/>`;
    ax+=`<text x="${L-8}" y="${y+3}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtVal(Math.pow(10,p))}</text>`; }
  // x labels: ~6 ticks
  let xl=''; const n=days.length, step=Math.max(1,Math.floor(n/6));
  for(let i=0;i<n;i+=step){ const x=X(pts[i].date.getTime());
    xl+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${days[i].date.slice(5)}</text>`; }
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.date.getTime()).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const dots=pts.map(p=>`<circle cx="${X(p.date.getTime()).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.2" fill="var(--navy)"><title>${p.date.toISOString().slice(0,10)}: ${fmtVal(p.v)}</title></circle>`).join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}">${grid}<path d="${line}" fill="none" stroke="var(--navy)" stroke-width="1.6"/>${dots}${ax}${xl}</svg>`;
}

// ---------- top 10 days ----------
function drawTopDays(){
  const top=[...DATA.days].sort((a,b)=>dayVal(b)-dayVal(a)).slice(0,10);
  let rows='';
  for(const d of top){
    const projs=(d.topProjects||[]).slice(0,3).map(p=>`<span class="proj">${esc(p.project)}</span>`).join(', ');
    const ses=(d.sampleSessions||[]).slice(0,2).map(s=>esc(s.label)).filter(Boolean).join(' · ');
    rows+=`<tr><td>${d.date}</td><td class="num">${fmtVal(dayVal(d))}</td>
      <td class="did">${projs}${ses?` <span class="ses">— ${ses}</span>`:''}</td></tr>`;
  }
  document.getElementById('topdays').innerHTML=
    `<table><thead><tr><th>Date</th><th class="num">${esc(METRIC_LBL[METRIC])}</th><th>what I did</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------- by model & by agent ----------
function aggBy(getter){ const acc={}; for(const d of DATA.days){ for(const [k,c] of Object.entries(getter(d))){
  acc[k]=(acc[k]||0)+metricValue(c, METRIC);} } return acc; }
function barRow(label,val,total,W,color){
  const w=total?Math.max(1,(val/total)*(W-150)):0; const pct=total?Math.round(100*val/total):0;
  return `<div style="display:flex;align-items:center;gap:8px;margin:5px 0">
    <div style="width:120px;color:var(--ink)">${esc(label)}</div>
    <svg width="${W-150}" height="16"><rect width="${w}" height="16" rx="3" fill="${color}"/></svg>
    <div style="color:var(--muted);font-variant-numeric:tabular-nums">${fmtVal(val)} · ${pct}%</div></div>`;
}
function drawModels(){
  const W=620;
  const models=aggBy(d=>d.byModel);
  const order=['opus','sonnet','haiku'].filter(m=>models[m]).concat(Object.keys(models).filter(m=>!['opus','sonnet','haiku'].includes(m)));
  const mTot=Object.values(models).reduce((a,b)=>a+b,0);
  const palette={opus:'#1B2A4A',sonnet:'#3a6ea5',haiku:'#8FB339',other:'#b0b7c3'};
  let html='<div style="margin-bottom:14px"><div style="color:var(--muted);font-size:12px;margin-bottom:4px">by model</div>';
  for(const m of order) html+=barRow(m, models[m], mTot, W, palette[m]||palette.other);
  html+='</div>';
  const av=aggBy(d=>d.mainVsSub); const aTot=(av.main||0)+(av.sub||0);
  html+='<div><div style="color:var(--muted);font-size:12px;margin-bottom:4px">main thread vs sub-agents</div>';
  html+=barRow('main', av.main||0, aTot, W, '#1B2A4A');
  html+=barRow('sub-agents', av.sub||0, aTot, W, '#F0A500');
  html+='</div>';
  document.getElementById('models').innerHTML=html;
}

// ---------- header + wiring ----------
function drawHeader(){
  const grand=DATA.days.reduce((a,d)=>a+dayVal(d),0);
  document.getElementById('totalVal').textContent=fmtVal(grand);
  document.getElementById('totalLbl').textContent=METRIC_LBL[METRIC]+' · all time';
  const m=DATA.meta;
  document.getElementById('subtitle').textContent=
    `${DATA.days.length} active days · tz ${m.tz} · ${m.unique_messages.toLocaleString()} messages (deduped from ${m.assistant_events.toLocaleString()})`;
  document.getElementById('heatHint').textContent='each cell = one day, shaded by '+METRIC_LBL[METRIC]+'.';
  document.getElementById('foot').textContent=
    `Generated from ~/.claude/projects logs · deduped by message.id · cost at API-equivalent rates (Opus $5/$25, cache-read 0.10×). Local & private.`;
}
function rerender(){ drawHeader(); drawHeatmap(); drawTimeseries(); drawTopDays(); drawModels(); }

document.getElementById('toggle').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  METRIC=b.dataset.m;
  [...document.querySelectorAll('#toggle button')].forEach(x=>x.classList.toggle('on', x===b));
  rerender();
});

async function boot(){
  if (typeof DATA === "string") {            // not injected by build.sh → live server mode
    DATA = await (await fetch("/api/data")).json();
  }
  if (DATA && DATA.days) rerender();
}
boot();
</script>
</body>
</html>
